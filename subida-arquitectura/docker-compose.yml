services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../subida-backend
      dockerfile: ../subida-arquitectura/docker/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=host.docker.internal
      - MINIO_ENDPOINT=http://minio:9000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://frontend:5173
    depends_on:
      minio:
        condition: service_started

  frontend:
    build:
      context: ../subida-frontend
      dockerfile: ../subida-arquitectura/docker/frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  minio_data:
