services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      echo 'Esperando que MinIO este listo...';
      until (/usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin}); do
        sleep 2;
      done;
      echo 'Creando bucket $${MINIO_BUCKET:-digitalizacion}...';
      /usr/bin/mc mb myminio/$${MINIO_BUCKET:-digitalizacion} --ignore-existing;
      echo 'Bucket $${MINIO_BUCKET:-digitalizacion} listo y configurado.';
      exit 0;
      "
    env_file:
      - .env

  backend:
    build:
      context: ../subida-backend
      dockerfile: ../subida-arquitectura/docker/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=host.docker.internal
      - MINIO_ENDPOINT=http://minio:9000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://frontend:5173
    depends_on:
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../subida-frontend
      dockerfile: ../subida-arquitectura/docker/frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  minio_data:
